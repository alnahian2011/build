name: Build TX6S Image
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Build Armbian
        run: |
          sudo useradd -m -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/builder
          git clone --depth=1 --branch=v20250306 https://github.com/NickAlilovic/build.git armbian
          sudo chown -R builder:builder armbian
          cd armbian
          sudo -u builder ./compile.sh \
            BOARD=tanix-tx6s-axp313 \
            BRANCH=current \
            RELEASE=jammy \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,img

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: tx6s-image
          path: armbian/output/images/*.img*
