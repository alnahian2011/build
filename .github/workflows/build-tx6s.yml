name: Build TX6S Image
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Build Armbian
        run: |
          sudo useradd -m -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/builder
          sudo -u builder git clone --depth=1 --branch=tx6s-main https://github.com/alnahian2011/build.git /home/builder/armbian
          sudo sed -i 's/console_width = (int(os.environ.get("COLUMNS", 160)) - 12) if os.environ.get("GITHUB_ACTIONS", "") == "" else 160/console_width = 160/' /home/builder/armbian/lib/tools/patching.py
          sudo sed -i 's/raise exit_with_exception/pass  # ignore patch failures/' /home/builder/armbian/lib/tools/patching.py
          sudo find /home/builder/armbian/patch/u-boot/u-boot-h616/ -name "*.patch" \
            ! -name "102-*.patch" \
            ! -name "105-*.patch" \
            ! -name "106-*.patch" \
            ! -name "107-*.patch" \
            ! -name "150-*.patch" \
            ! -name "151-*.patch" \
            ! -name "152-*.patch" \
            ! -name "153-*.patch" \
            ! -name "157-*.patch" \
            -delete
          sudo sed -i 's|arch/arm/dts/allwinner/sun50i-h616-tanix-tx6s-axp313.dtb|arch/arm/dts/sun50i-h616-tanix-tx6s-axp313.dtb|g' /home/builder/armbian/patch/u-boot/u-boot-h616/153-add-tanix_tx6s_axp313_defconfig.patch
          sudo -u builder bash -c "cd /home/builder/armbian && env -u GITHUB_ACTIONS -u GITHUB_OUTPUT ./compile.sh \
            BOARD=tanix-tx6s-axp313 \
            BRANCH=current \
            RELEASE=bookworm \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,img \
            PREFER_DOCKER=no \
            IGNORE_UPDATES=yes"

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: tx6s-image
          path: /home/builder/armbian/output/images/*.img*            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,img \
            PREFER_DOCKER=no \
            IGNORE_UPDATES=yes"

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: tx6s-image
          path: /home/builder/armbian/output/images/*.img*
